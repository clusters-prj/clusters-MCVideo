# ffmpeg の実行ファイル(PATHに通っていればそのままでOK)
ffmpeg-path: "ffmpeg"

# 再生FPS。マップ更新は帯域を食うので 8〜12 くらいがおすすめ
fps: 10

# fit = 縦横比を維持して黒帯を入れる / stretch = 画面いっぱいに引き伸ばす
aspect: fit

# 画面サイズの上限(マップ枚数: 横 x 縦)
max-width: 8
max-height: 6

# 動画ファイル/URL(play)をループ再生するか
loop: false

live:
  # ライブ(listen モード)で受け付ける RTMP ポート
  listen-port: 1935
  # 配信が切れたら自動で待ち受けに戻る(OBSの再接続用)
  reconnect: true

# 差分更新(大きい画面でサーバーが固まるのを防ぐ)
# 前提: paper-world-defaults.yml の maps.item-frame-cursor-update-interval を 1 にしておくこと
block-update:
  # 1tick・1スクリーンあたりに更新するマップ枚数の上限(0 = 無制限)。大きい画面ほど小さめに。
  # 変化の大きいマップから優先して更新し、溢れた分は次のtick以降に回る
  max-maps-per-tick: 48
  # 色の差がこの値(RGB 0〜255 換算)以下のピクセルは「変わっていない」とみなす。大きいほど軽く、ざらつく
  pixel-threshold: 20
  # 16x16 ブロックの中でこの数以上のピクセルが変わったときだけ、そのブロックを更新する
  block-min-pixels: 4

# 音声を Minecraft-Spatial-Audio-Link(msal-node) のボイスチャットで流す
# スクリーンの位置に「音源」ができ、VC に接続しているプレイヤーが近づくと聞こえる
vc-audio:
  enabled: false
  # msal-node のベースURL(プラグインから届く内部アドレス)
  base-url: "http://127.0.0.1:8010"
  # msal-node の .env の PLUGIN_API_KEY と同じ値(必須。空だと無効)
  api-key: ""
  # スクリーン中心から何ブロックまで聞こえるか(1〜128)
  range: 32
  # 音量(0.0〜1.0)
  volume: 1.0
  # VC 経由の音声は少し遅れて届くので、映像の表示を遅らせて合わせる(ms)。ズレが気になったら調整
  video-delay-ms: 400
